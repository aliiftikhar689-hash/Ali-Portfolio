<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Hafiz Ali Iftikhar placeholder portrait</title>
  <desc id="desc">A stylized gradient portrait placeholder showing initials HA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5ee7ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#112640"/>
      <stop offset="100%" stop-color="#050816"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="320" r="220" fill="url(#glow)" opacity="0.75"/>
  <circle cx="400" cy="320" r="180" fill="rgba(17,25,40,0.78)" stroke="rgba(255,255,255,0.2)"/>
  <text x="400" y="470" text-anchor="middle" fill="#e5f3ff" font-size="220" font-family="Segoe UI, Arial, sans-serif" font-weight="700">HA</text>
</svg>
